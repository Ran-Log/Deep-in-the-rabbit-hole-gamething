name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore "Afterlife Thingy.sln"

      - name: Compilar
        run: dotnet build "Afterlife Thingy.sln" --no-restore --configuration Debug

  test-game-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar y correr los tests de lógica pura
        working-directory: Tests/GameLogic.Tests
        run: dotnet run
